name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Security considerations
      description: Does it delete, share, read local files or return text written by others?

name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include session data, tokens, share links or real file contents. For security problems use a private
        advisory instead: https://github.com/3lgr/proton-drive-mcp/security/advisories/new
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `proton-drive version`, `node --version`, this server's version, and your MCP client"
  - type: textarea
    id: doctor
    attributes:
      label: "`proton-drive-cli doctor` output"
      render: text

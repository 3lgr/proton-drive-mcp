name: MCPB bundle

# Builds the .mcpb bundle from a published release, checks it, attaches it together with SHA256SUMS and a build
# provenance attestation. Assets are never overwritten (no --clobber): re-running for an existing tag fails.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # A manual run is only allowed from main; a release run is tied to the release tag.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Release tag must match package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p "require('./package.json').version")"

      - name: Lint and test before packaging
        run: npm run ci

      - name: Build bundle
        run: npm run package:mcpb

      - name: Checksums
        working-directory: out/mcpb
        run: sha256sum ./*.mcpb > SHA256SUMS && cat SHA256SUMS

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: |
            out/mcpb/*.mcpb
            out/mcpb/SHA256SUMS
          if-no-files-found: error

  attest-and-attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write      # attach to the release
      id-token: write      # sigstore keyless signing for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb

      - name: Verify checksums
        run: sha256sum --check SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.mcpb'

      - name: Attach to release (never overwrites)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG_NAME" ./*.mcpb ./SHA256SUMS

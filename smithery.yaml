name: proton-drive-mcp-hardened
displayName: Proton Drive MCP (hardened fork)
description: >
  Hardened fork of proton-drive-mcp (unofficial, not affiliated with Proton AG). MCP server and
  CLI for Proton Drive and Proton Photos through the official proton-drive CLI, with consent
  gates the model cannot bypass, a local path allowlist and a sharing policy.
license: MIT
homepage: https://github.com/3lgr/proton-drive-mcp
repository: https://github.com/3lgr/proton-drive-mcp
categories:
  - storage
  - productivity
  - privacy
tools:
  - drive_auth_status
  - drive_auth_logout
  - drive_version
  - drive_list
  - drive_mkdir
  - drive_upload
  - drive_download
  - drive_move
  - drive_delete
  - drive_list_trash
  - drive_share_status
  - drive_share_invite
  - drive_share_revoke
  - drive_trash
  - drive_sync_plan
  - drive_bulk_move
  - drive_bulk_trash
  - drive_restore
  - drive_empty_trash
  - drive_read_file
  - drive_read_content
  - drive_copy
  - drive_list_invitations
  - drive_invitation_accept
  - drive_invitation_reject
  - drive_share_leave
  - photos_list_albums
  - photos_create_album
  - photos_delete_album
  - photos_list_album_photos
  - photos_add_to_album
  - photos_remove_from_album
  - drive_share_set_url
  - drive_share_remove_url
  - drive_share_remove_all
  - photos_update_album
  - photos_list_timeline
  - photos_download
  - photos_upload
  - drive_info
  - drive_tree
  - drive_search
  - drive_rename
  - drive_usage
  - drive_find_duplicates
  - drive_sharing_audit
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      PROTON_DRIVE_SYNC_PATH:
        type: string
        description: "Absolute path to the root of your local Proton Drive sync folder. Required only for drive_read_file. Example: /Users/you/Proton Drive"
  commandFunction: |-
    (config) => ({
      // Pinned to a release tag on purpose: never run a floating version of a program that holds your session.
      command: "npx",
      args: ["--yes", "github:3lgr/proton-drive-mcp#v2.0.3"],
      env: config.PROTON_DRIVE_SYNC_PATH ? { PROTON_DRIVE_SYNC_PATH: config.PROTON_DRIVE_SYNC_PATH } : {}
    })
